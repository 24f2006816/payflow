spring:
  application:
    name: payflow
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      connection-timeout: 3000
      # Fail fast instead of queueing forever behind a hot row lock; surfaces as a retryable 409.
      # (Hibernate ignores jakarta.persistence.lock.timeout on PostgreSQL, so set it on the session.)
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Flyway owns the schema
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 20
        # NOTE: do NOT enable order_inserts: postings reference journal_entries through a plain UUID
        # column (no JPA association), so Hibernate could reorder them and break the foreign key.
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: payflow-webhooks
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: payflow
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

logging:
  level:
    com.payflow: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

resilience4j:
  circuitbreaker:
    instances:
      psp:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.payflow.topup.psp.PspUnavailableException
  retry:
    instances:
      psp:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.payflow.topup.psp.PspUnavailableException

payflow:
  fees:
    bps: ${FEE_BPS:200}                        # 2.00% platform fee on captured amounts
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    jwt-issuer: ${JWT_ISSUER:https://payflow.local}
    token-ttl: 15m
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:600}
  idempotency:
    lock-timeout: 30s
    retention: 24h
  outbox:
    topic: payflow.payment-events
    batch-size: 100
    poll-interval: 500ms
  webhooks:
    poll-interval: 1s
    batch-size: 50
    max-attempts: 8
    base-backoff: 2s
    max-backoff: 30m
    connect-timeout: 2s
    read-timeout: 5s
    allow-insecure-http: ${WEBHOOKS_ALLOW_HTTP:false}
    allow-private-hosts: ${WEBHOOKS_ALLOW_PRIVATE:false}
  psp:
    latency: 50ms
    transient-failure-rate: 0.0
  reconciliation:
    cron: "0 */10 * * * *"
  topups:
    recovery-interval: 30s
    recovery-min-age: 60s
