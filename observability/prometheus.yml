global:
  scrape_interval: 10s

scrape_configs:
  - job_name: payflow
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8080"]

rule_files: []
# Suggested alerts (add an alerting rules file in production):
#   payflow_reconciliation_mismatches > 0                         -> page immediately (ledger drift)
#   payflow_outbox_backlog > 1000 for 5m                           -> Kafka publishing stuck
#   rate(payflow_webhooks_total{outcome="dead"}[15m]) > 0           -> merchants missing events
#   histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket[5m]))) > 1
